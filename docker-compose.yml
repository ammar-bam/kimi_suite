services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: kimi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kimi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kimi}
      POSTGRES_DB: ${POSTGRES_DB:-kimi_suite}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kimi} -d ${POSTGRES_DB:-kimi_suite}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
    name: kimi_postgres_data
